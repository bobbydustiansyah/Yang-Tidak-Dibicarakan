<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruang Tulis — Yang Kita Bicarakan</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--paper:#f4ecdf;--ink:#201f1b;--muted:#777166;--line:#d7cdbd}
*{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:38px 24px 70px}
header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:28px}
h1{font:42px Georgia,serif;margin:0 0 8px}.sub{color:var(--muted)}button,select,input,textarea{font:inherit}
input,select,textarea{width:100%;border:1px solid var(--line);background:#f8f2e8;color:var(--ink);padding:17px 18px;border-radius:0}
input{font:24px Georgia,serif} select{font-size:18px} textarea{min-height:390px;resize:vertical;line-height:1.7;font-family:Georgia,serif;font-size:18px}
label{display:block;margin:20px 0 9px;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.08em}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.actions{display:flex;gap:16px;margin-top:22px}.btn{padding:16px 28px;border:1px solid var(--line);background:transparent;cursor:pointer}.primary{background:#1e1d19;color:#fff;border-color:#1e1d19}
#status{margin-top:18px;color:var(--muted);white-space:pre-wrap}.error{color:#9b342c}.ok{color:#52664d}
.card{border-top:1px solid var(--line);padding:20px 0;display:flex;justify-content:space-between;gap:15px}.meta{color:var(--muted);font-size:14px;margin-top:6px}.small button{padding:8px 11px;margin-left:5px}
@media(max-width:650px){.wrap{padding:28px 18px}.row{grid-template-columns:1fr}h1{font-size:34px}.actions{flex-direction:column}.actions button{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div><h1>Ruang Tulis</h1><div class="sub">Yang Kita Bicarakan · ruang pribadi untuk menulis</div></div>
<button class="btn" id="logout">Keluar</button>
</header>

<form id="form">
<label for="title">Judul</label>
<input id="title" required placeholder="Judul tulisan…">

<div class="row">
<div><label for="type">Jenis</label>
<select id="type"><option value="puisi">Puisi</option><option value="jurnal">Jurnal</option></select></div>
<div><label for="theme">Tema</label>
<select id="theme">
<option>Rindu</option><option>Kehilangan</option><option>Pulang</option><option>Malam</option><option>Catatan</option><option>Lainnya</option>
</select></div>
</div>

<label for="content">Isi</label>
<textarea id="content" required placeholder="Tulis di sini…"></textarea>

<div class="actions">
<button class="btn" type="button" id="draft">Simpan Draft</button>
<button class="btn primary" type="button" id="publish">Terbitkan</button>
</div>
<div id="status"></div>
</form>

<h2 style="font:28px Georgia,serif;margin-top:55px">Tulisan Saya</h2>
<div id="list">Memuat…</div>
</div>

<script>
const SUPABASE_URL = "https://yewaudnwthgmxivxlrkq.supabase.co";
const SUPABASE_KEY = "sb_publishable_rHYXOaAtrrrNzSrbszKEKw_w1lE10TY";
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentUser = null;
let editingId = null;

const $ = id => document.getElementById(id);
function slugify(s){return s.toString().toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "tulisan";}
function message(text, cls=""){ $("status").className=cls; $("status").textContent=text; }

async function init(){
  const {data,error}=await client.auth.getUser();
  if(error || !data.user){
    message("Sesi login tidak ditemukan. Silakan login kembali.","error");
    $("form").style.display="none"; return;
  }
  currentUser=data.user;
  await loadList();
}
async function save(status){
  const title=$("title").value.trim(), content=$("content").value.trim(), type=$("type").value, theme=$("theme").value;
  if(!title || !content){message("Judul dan isi wajib diisi.","error");return;}
  message("Menyimpan…");
  const payload={
    title, content, type, theme,
    status,
    slug: slugify(title),
    author_id: currentUser.id,
    published_at: status==="published" ? new Date().toISOString() : null,
    updated_at: new Date().toISOString()
  };
  let result;
  if(editingId){
    delete payload.author_id;
    result=await client.from("poems").update(payload).eq("id",editingId);
  }else{
    payload.created_at=new Date().toISOString();
    result=await client.from("poems").insert(payload);
  }
  if(result.error){
    console.error(result.error);
    message("Gagal menyimpan:\n"+result.error.message+
      (result.error.details ? "\n"+result.error.details:"")+
      (result.error.hint ? "\n"+result.error.hint:""),"error");
    return;
  }
  message(status==="published" ? "Puisi/Jurnal berhasil diterbitkan." : "Draft berhasil disimpan.","ok");
  resetForm(); await loadList();
}
function resetForm(){editingId=null;$("form").reset();$("type").value="puisi";$("theme").value="Rindu";}
async function loadList(){
  const {data,error}=await client.from("poems").select("*").order("created_at",{ascending:false});
  if(error){$("list").textContent="Gagal memuat: "+error.message;return;}
  if(!data?.length){$("list").textContent="Belum ada tulisan.";return;}
  $("list").innerHTML=data.map(x=>`
  <div class="card">
    <div><strong>${esc(x.title||"(tanpa judul)")}</strong>
    <div class="meta">${esc(x.type||"puisi")} · ${esc(x.theme||"")} · ${esc(x.status||"")}</div></div>
    <div class="small">
      <button class="btn" onclick="editPost('${x.id}')">Edit</button>
      <button class="btn" onclick="togglePost('${x.id}','${x.status}')">${x.status==="published"?"Jadikan Draft":"Terbitkan"}</button>
      <button class="btn" onclick="deletePost('${x.id}')">Hapus</button>
    </div>
  </div>`).join("");
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
window.editPost=async id=>{
 const {data,error}=await client.from("poems").select("*").eq("id",id).single();
 if(error){message(error.message,"error");return}
 editingId=id;$("title").value=data.title||"";$("content").value=data.content||"";
 $("type").value=data.type||"puisi";$("theme").value=data.theme||"Rindu";
 window.scrollTo({top:0,behavior:"smooth"});message("Mode edit aktif.","ok");
};
window.togglePost=async(id,status)=>{
 message("Menyimpan…");
 const next=status==="published"?"draft":"published";
 const {error}=await client.from("poems").update({status:next,published_at:next==="published"?new Date().toISOString():null,updated_at:new Date().toISOString()}).eq("id",id);
 if(error){message("Gagal:\n"+error.message,"error");return} await loadList();message(next==="published"?"Berhasil diterbitkan.":"Dipindahkan menjadi draft.","ok");
};
window.deletePost=async id=>{
 if(!confirm("Hapus tulisan ini?"))return;
 const {error}=await client.from("poems").delete().eq("id",id);
 if(error){message("Gagal menghapus:\n"+error.message,"error");return} await loadList();message("Tulisan dihapus.","ok");
};
$("draft").onclick=()=>save("draft");
$("publish").onclick=()=>save("published");
$("logout").onclick=async()=>{await client.auth.signOut();location.href="login.html";};
init();
</script>
</body>
</html>
