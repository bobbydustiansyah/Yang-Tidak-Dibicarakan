(async()=>{const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_KEY),s=new URLSearchParams(location.search).get("slug"),{data}=await sb.from("poems").select("*").eq("status","published");const r=(data||[]).find(x=>(x.slug||"")===s);if(!r){document.getElementById("poem-title").textContent="Puisi tidak ditemukan.";return}let c=r.content||r.body||r.isi||"";document.title=r.title+" — Yang Kita Bicarakan";document.getElementById("poem-title").textContent=r.title;document.getElementById("poem-date").textContent=(r.published_at?new Intl.DateTimeFormat("id-ID",{day:"2-digit",month:"long",year:"numeric"}).format(new Date(r.published_at)):"")+" · "+(r.theme||"");document.getElementById("poem-content").innerHTML=c.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").split(/\n{2,}/).map(x=>"<p>"+x.replace(/\n/g,"<br>")+"</p>").join("");document.getElementById("themeToggle").onclick=()=>document.body.classList.toggle("dark")})();
</script></body></html>
