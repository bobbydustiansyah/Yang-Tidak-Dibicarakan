<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Puisi — Yang Kita Bicarakan</title><link rel="stylesheet" href="public-style.css"></head>
<body>
<header class="site-header">
<a class="brand" href="index.html">yang kita bicarakan<br><em>pukul dua dini hari</em></a>
<nav><a href="index.html">PUISI</a><a href="index.html#catatan">CATATAN</a><a href="index.html#arsip">ARSIP</a><a href="index.html#tentang">TENTANG</a></nav>
</header>
<main class="section reading">
<div class="section-label" id="poem-date">MEMUAT…</div>
<h1 id="poem-title">Memuat puisi…</h1>
<div id="poem-content" class="poem-content"></div>
<a href="index.html#terakhir">← kembali ke tulisan</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(async function(){
 const sb=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_KEY);
 const slug=new URLSearchParams(location.search).get("slug");
 const {data,error}=await sb.from("poems").select("*").eq("status","published");
 if(error){document.getElementById("poem-title").textContent="Puisi tidak dapat dimuat.";return;}
 const r=(data||[]).find(x=>(x.slug||String(x.title||"").toLowerCase().trim().replace(/\s+/g,"-"))===slug);
 if(!r){document.getElementById("poem-title").textContent="Puisi tidak ditemukan.";return;}
 const content=r.content||r.body||r.isi||"";
 document.title=r.title+" — Yang Kita Bicarakan";
 document.getElementById("poem-title").textContent=r.title;
 document.getElementById("poem-date").textContent=(r.published_at?new Intl.DateTimeFormat("id-ID",{day:"2-digit",month:"long",year:"numeric"}).format(new Date(r.published_at)):"")+" · "+(r.theme||"Catatan");
 document.getElementById("poem-content").innerHTML=String(content).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").split(/\n{2,}/).map(x=>"<p>"+x.replace(/\n/g,"<br>")+"</p>").join("");
})();
</script></body></html>
